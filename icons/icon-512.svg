<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Ring Shield -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.3" stroke-dasharray="12 8"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="#10B981" stroke-width="2" opacity="0.4"/>

  <!-- Academic Cap & Book Icon -->
  <g transform="translate(256, 230) scale(1.1)">
    <!-- Book Pages -->
    <path d="M-120,70 Q-60,50 0,65 Q60,50 120,70 L110,120 Q60,105 0,115 Q-60,105 -110,120 Z" fill="url(#cardGrad)" stroke="url(#goldGrad)" stroke-width="6"/>
    
    <!-- Mortarboard Diamond -->
    <polygon points="0,-100 130,-45 0,10 -130,-45" fill="url(#goldGrad)" filter="url(#glow)"/>
    
    <!-- Cap Top Shadow -->
    <polygon points="0,-90 115,-45 0,0 -115,-45" fill="#047857" opacity="0.6"/>
    
    <!-- Cap Base -->
    <path d="M-60,-25 L-60,15 Q0,45 60,15 L60,-25 Z" fill="#022C22" stroke="url(#goldGrad)" stroke-width="4"/>
    
    <!-- Tassel -->
    <path d="M0,-45 Q60,-20 85,25 L75,70 L95,70 L85,25" fill="none" stroke="#FDE047" stroke-width="6" stroke-linecap="round"/>
    <circle cx="85" cy="72" r="8" fill="#F59E0B"/>
    <circle cx="0" cy="-45" r="7" fill="#FDE047"/>

    <!-- Central Glowing Star (Ethiopian Knowledge Emblem) -->
    <polygon points="0,-30 8,-12 26,-12 12,0 17,18 0,7 -17,18 -12,0 -26,-12 -8,-12" fill="#FFFFFF" filter="url(#glow)"/>
  </g>

  <!-- Brand Typography Badge -->
  <text x="256" y="440" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="46" fill="#F8FAFC" letter-spacing="6">NANOVA</text>
  <text x="256" y="470" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" fill="#34D399" letter-spacing="4">ETHIOPIAN EXAM HUB</text>
</svg>
